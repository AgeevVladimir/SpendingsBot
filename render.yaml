services:
  - type: worker
    name: spendingsbot
    env: docker
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_SHEETS_SPENDINGS_WORKSHEET
        value: spendings
